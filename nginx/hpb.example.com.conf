upstream nextcloud_talk_hpb {
    server 127.0.0.1:8081;
    keepalive 32;
}

server {
    server_name hpb.example.com;

    access_log /var/log/nginx/hpb.access.log;
    error_log  /var/log/nginx/hpb.error.log;

    location / {
        proxy_pass http://nextcloud_talk_hpb;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_buffering off;
        proxy_redirect off;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;

    ssl_certificate /etc/letsencrypt/live/hpb.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hpb.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;

    server_name hpb.example.com;

    return 301 https://$host$request_uri;
}
